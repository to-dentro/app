<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | Tô Dentro</title>
    <link rel="icon" type="image/png" href="../../assets/images/brand/icon.png?v=2">
    <link rel="icon" type="image/png" href="../../assets/images/brand/icon-dark-mode.png?v=2" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/pages/perfil.css">
    <script defer src="../scripts/services/auth.js"></script>
    <script defer src="../scripts/services/navigation.js"></script>
</head>

<body>
    <main class="page-container profile-page" id="conteudo-principal">
        <header class="profile-header">
            <a class="profile-back" href="../../index.html" aria-label="Voltar ao início">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_back_ios_new</span>
            </a>
            <h1>Meu perfil</h1>
            <a class="profile-settings-icon" href="./configuracoes.html" aria-label="Configurações" title="Configurações">
                <span class="material-symbols-outlined" aria-hidden="true">settings</span>
            </a>
        </header>

        <section class="profile-identity" aria-labelledby="profile-name">
            <span class="profile-avatar" aria-hidden="true">
                <span class="material-symbols-outlined">person</span>
            </span>
            <div>
                <h2 id="profile-name">Meu perfil</h2>
                <p id="profile-email"></p>
                <p>Seu futuro, suas escolhas.</p>
            </div>
        </section>

        <blockquote class="profile-encouragement">
            <span class="profile-encouragement-mark" aria-hidden="true">“</span>
            <p id="profile-encouragement-text">Estudar para o vestibular cansa. Você pode fazer uma pausa e retomar no seu ritmo.</p>
        </blockquote>

        <section class="profile-preferences" aria-labelledby="preferences-title">
            <div class="profile-preferences-header">
                <h2 id="preferences-title">Preferências</h2>
                <a hidden id="edit-preferences" class="profile-edit-preferences" href="./preferencias.html"
                    aria-label="Editar preferências" title="Editar preferências">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m16 3 5 5M3 21l5-1L21 7a2.1 2.1 0 0 0-5-5L3 15Z" />
                    </svg>
                </a>
            </div>

            <div class="profile-preferences-card">
                <p>Cidades: <span id="profile-city">—</span></p>
                <p>Tipo de instituição: <span id="profile-type">—</span></p>
                <p>Modalidades: <span id="profile-mode">—</span></p>
                <p>Turnos: <span id="profile-period">—</span></p>
                <p>Formas de ingresso: <span id="profile-admission">—</span></p>
                <p>Área: <span id="profile-area">—</span></p>
                <p>Curso: <span id="profile-course">—</span></p>
            </div>
        </section>

        <p id="profile-status" role="status" hidden></p>
        <button class="button button-blue" type="button" id="profile-retry" hidden>Tentar novamente</button>
    </main>
    <td-bottom-nav active="perfil"></td-bottom-nav>
    <script defer src="../data/mock-data.js"></script>
    <script defer src="../data/catalog.js"></script>
    <script defer src="../data/universities.js"></script>
    <script defer src="../scripts/components/bottom-nav.js"></script>
    <script defer src="../data/courses.js"></script>
    <script defer src="../scripts/pages/perfil.js"></script>
    <script defer src="../scripts/components/external-links.js"></script>
</body>

</html>
